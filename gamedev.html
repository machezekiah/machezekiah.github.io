<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Dev | mchelien's world!</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #eef2f7;
            --dark: #0b1f3b;
            --accent: #7ba4d0;
            --white: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: linear-gradient(#d1d9e6 1px, transparent 1px), linear-gradient(90deg, #d1d9e6 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--dark);
        }

        nav {
            background: var(--dark);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--accent);
        }

        .nav-logo { font-family: 'Press Start 2P', cursive; color: var(--white); text-decoration: none; font-size: 0.8rem; }
        .back-link { color: var(--accent); text-decoration: none; font-family: 'Press Start 2P', cursive; font-size: 0.6rem; }

        .content-wrapper { max-width: 800px; margin: 40px auto; padding: 0 20px; }

        main {
            background: var(--white);
            border: 4px solid var(--dark);
            padding: 40px;
            box-shadow: 10px 10px 0px var(--dark);
        }

        .page-title { font-family: 'Press Start 2P', cursive; font-size: 1.5rem; margin-bottom: 20px; color: var(--dark); }
        
        .status-box {
            background: #0b1f3b;
            color: #7ba4d0;
            padding: 15px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .project-card {
            border: 4px solid var(--dark);
            padding: 20px;
            margin-top: 20px;
        }

        h2 { font-family: 'Press Start 2P', cursive; font-size: 1rem; margin-bottom: 15px; color: var(--dark); }
        .tech { font-weight: bold; color: var(--accent); margin-bottom: 10px; display: block; }
        
        .download-zone {
            margin-top: 30px;
            padding: 20px;
            background: var(--dark);
            color: var(--white);
            text-align: center;
        }

        footer { text-align: center; padding: 50px; font-family: 'Press Start 2P', cursive; font-size: 0.6rem; color: #666; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="nav-logo">MCHELIEN.</a>
        <a href="index.html" class="back-link">< BACK_TO_HOME</a>
    </nav>

    <div class="content-wrapper">
        <main>
            <h1 class="page-title">Game Development</h1>
            
            <div class="status-box">
                PROJECT: UNDERGRADUATE_THESIS<br>
                STATUS: IN_DEVELOPMENT
            </div>

            <div class="project-card">
                <h2>Apostle</h2>
                <span class="tech">Unity Engine | C# | 2D</span>
                <p>An educational game project for my IT degree at UNSRAT.</p>
            </div>

            <div class="download-zone">
                <p style="font-family: 'Press Start 2P', cursive; font-size: 0.7rem; color: var(--accent);">AVAILABILITY</p>
                <p>The application will be shared here once it is officially released.</p>
            </div>
        </main>
    </div>

    <footer>
        &copy; 2026 mchelien's world!
    </footer>

</body>
</html>
