<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ministry & Service | mchelien's world!</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #eef2f7;
            --dark: #0b1f3b;
            --accent: #7ba4d0;
            --white: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: linear-gradient(#d1d9e6 1px, transparent 1px), linear-gradient(90deg, #d1d9e6 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--dark);
        }

        nav {
            background: var(--dark);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--accent);
        }

        .nav-logo { font-family: 'Press Start 2P', cursive; color: var(--white); text-decoration: none; font-size: 0.8rem; }
        .back-link { color: var(--accent); text-decoration: none; font-family: 'Press Start 2P', cursive; font-size: 0.6rem; }

        .content-wrapper { max-width: 800px; margin: 40px auto; padding: 0 20px; }

        main {
            background: var(--white);
            border: 4px solid var(--dark);
            padding: 40px;
            box-shadow: 10px 10px 0px var(--dark);
        }

        .page-title { font-family: 'Press Start 2P', cursive; font-size: 1.5rem; margin-bottom: 20px; color: var(--dark); }
        
        .status-badge {
            display: inline-block;
            background: var(--dark);
            color: var(--accent);
            padding: 8px 15px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
            margin-bottom: 30px;
        }

        .gallery-nav {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-top: 20px;
        }

        .gallery-button {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 15px;
            border: 4px solid var(--dark);
            background: #f8fafc;
            text-decoration: none;
            color: var(--dark);
            transition: all 0.2s ease;
            box-shadow: 6px 6px 0px var(--dark);
        }

        .gallery-button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 12px 12px 0px var(--accent);
            background: var(--white);
        }

        /* Foto Spoiler */
        .preview-img {
            width: 80px;
            height: 80px;
            border: 3px solid var(--dark);
            object-fit: cover;
            flex-shrink: 0;
            background: #ccc;
        }

        .button-text {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            flex-grow: 1;
            line-height: 1.5;
        }

        .arrow { font-size: 1.2rem; font-weight: bold; margin-right: 10px; }
        
        footer { text-align: center; padding: 50px; font-family: 'Press Start 2P', cursive; font-size: 0.6rem; color: #666; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="nav-logo">MCHELIEN.</a>
        <a href="index.html" class="back-link">< BACK</a>
    </nav>

    <div class="content-wrapper">
        <main>
            <h1 class="page-title">Ministry & Service</h1>
            <div class="status-badge">UPK-Kr. FT UNSRAT</div>
            
            <div class="gallery-nav">
                <!-- CCS Gallery -->
                <a href="ccs-gallery.html" class="gallery-button">
                    <img src="ccs-preview.jpg" alt="CCS" class="preview-img">
                    <span class="button-text">Christ-Centered Servant (2023-2024)</span>
                    <span class="arrow">></span>
                </a>

                <!-- CFS Gallery -->
                <a href="cfs-gallery.html" class="gallery-button">
                    <img src="cfs-preview.jpg" alt="CFS" class="preview-img">
                    <span class="button-text">Christ Faithful Servant (2024-2025)</span>
                    <span class="arrow">></span>
                </a>

                <!-- KK Gallery -->
                <a href="kk-gallery.html" class="gallery-button">
                    <img src="kk-preview.jpg" alt="KK" class="preview-img">
                    <span class="button-text">Discipleship Groups</span>
                    <span class="arrow">></span>
                </a>
            </div>
        </main>
    </div>

    <footer>
        &copy; 2026 mchelien's world!
    </footer>

</body>
</html>
